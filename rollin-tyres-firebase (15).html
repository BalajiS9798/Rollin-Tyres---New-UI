<style>
:root{--bg:#f4f4f1;--surf:#fff;--ink:#1d1f22;--mut:#5d636b;--line:#d5d7da;--acc:#f2c230;--acc-t:#1d1f22;--side:#f2c230;--side-t:#1d1f22;--warn:#b45309;--warnbg:#fef3c7;--bad:#b42318;--badbg:#fee4e2;--ok:#176b3a;--okbg:#dcf5e5;--ft:'Barlow',system-ui,sans-serif;--fh:'Barlow Condensed','Arial Narrow',sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1e;--surf:#27292c;--ink:#f1f1ee;--mut:#a3a9b0;--line:#3d4046;--acc:#f2c230;--acc-t:#1d1f22;--side:#f2c230;--warn:#fbbf24;--warnbg:#3a2a07;--bad:#fda29b;--badbg:#3b1512;--ok:#7fe0a2;--okbg:#0f2e1c}}
:root[data-theme="dark"]{--bg:#1b1c1e;--surf:#27292c;--ink:#f1f1ee;--mut:#a3a9b0;--line:#3d4046;--acc:#f2c230;--acc-t:#1d1f22;--side:#f2c230;--warn:#fbbf24;--warnbg:#3a2a07;--bad:#fda29b;--badbg:#3b1512;--ok:#7fe0a2;--okbg:#0f2e1c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--ft)}
#app{display:flex;height:100%}
nav{width:280px;background:var(--side);color:var(--side-t);padding:34px 20px 24px;display:flex;flex-direction:column;gap:6px;flex:none}
.brand{padding:0 6px 26px;margin-bottom:16px;border-bottom:1.5px solid rgba(29,31,34,.28)}
.brand .bw{width:fit-content;max-width:100%}
.brand .wm{display:block;font:400 42px/1 'Anton',Impact,'Arial Narrow',sans-serif;letter-spacing:.02em;color:#1d1f22;white-space:nowrap}
.brand .sl{display:flex;justify-content:space-between;margin-top:12px;font:400 19px/1 'Anton',Impact,'Arial Narrow',sans-serif;color:#1d1f22}
.brand .sl i{font-style:normal}.brand .sl i.s{width:.5em}
nav button{all:unset;cursor:pointer;padding:15px 16px;border-radius:10px;font-weight:700;font-size:17px;color:var(--side-t)}
nav button:hover{background:rgba(29,31,34,.1)}
nav button.on{background:#1d1f22;color:#f2c230}
nav .sp{flex:1}
main{flex:1;overflow:auto;padding:36px clamp(24px,3.5vw,48px) 48px}
h1{font:700 34px/1.1 var(--fh);margin:0 0 22px;letter-spacing:.3px}
h2{font:700 22px/1.1 var(--fh);margin:0 0 10px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:22px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 160px}
label{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;padding:10px 11px;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.btn{font:600 15px var(--ft);min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--mut)}
.btn.p{background:var(--acc);color:var(--acc-t);border-color:var(--acc)}
.btn.d{color:var(--bad)}
.btn.s{min-height:36px;padding:0 10px;font-size:14px}
.btn.w{background:#1f9d55;color:#fff;border-color:#1f9d55}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:13px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-low{background:var(--warnbg);color:var(--warn)}.b-out{background:var(--badbg);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr;gap:16px}
.res{max-height:300px;overflow:auto;margin-top:8px}
.res button{all:unset;display:flex;justify-content:space-between;gap:8px;width:100%;box-sizing:border-box;padding:10px;border-bottom:1px solid var(--line);cursor:pointer}
.res button:hover{background:var(--bg)}
.q{display:inline-flex;align-items:center;gap:4px}
.q input{width:64px;text-align:center;padding:4px}
.tot{display:flex;justify-content:space-between;padding:4px 0}
.tot.g{font:700 26px var(--fh);border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.mut{color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
dialog{border:0;padding:0;background:transparent;color:var(--ink);width:min(560px,90vw);max-height:none;overflow:visible}
.dbox{border:1px solid var(--line);border-radius:12px;padding:20px;background:var(--surf);max-height:88vh;overflow:auto}
.dx{position:absolute;top:-16px;right:-12px;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--surf);color:var(--ink);font:700 18px var(--ft);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.dx:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
dialog::backdrop{background:#0008}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;display:none;z-index:99}
.ok-box{text-align:center;padding:24px 10px}
.ok-box .big{font:700 40px var(--fh);color:var(--ok)}
#print{display:none}
.inv{font:14px/1.4 Arial,sans-serif;color:#000;background:#fff}
.inv h3{margin:0;font-size:24px}
.inv table{font-size:13px}.inv th,.inv td{border-bottom:1px solid #bbb;color:#000}
.inv.th{width:76mm;font-size:12px}
.inv.th h3{font-size:18px;text-align:center}
.inv .c{text-align:center}
.inv .tag{font:400 11px/1 'Josefin Sans',Arial,sans-serif;letter-spacing:.42em;text-transform:uppercase;color:#2e3b31}
.inv.th .tag{font-size:9px}
@media(max-width:820px){#app{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;padding:8px;align-items:center;gap:4px}.brand{padding:0 10px;margin:0;border:0}.brand .wm{font-size:24px}.brand .sl,nav .sp{display:none}nav button{white-space:nowrap;padding:11px 14px;font-size:15px}.grid2{grid-template-columns:1fr}main{padding:16px}}

/* ---------- Login screen ---------- */
.lg{--pt:clamp(48px,13vh,130px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:100vh;min-height:100dvh;background:var(--bg)}
.lg-l{position:relative;overflow:hidden;background:#f2c230;color:#1d1f22;padding:56px clamp(28px,4.5vw,56px) 48px;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.lg-brand{--fs:clamp(36px,5.4vw,84px);position:relative;z-index:2}
.lg-brand h1{font:400 var(--fs)/1 'Anton',Impact,'Arial Narrow',sans-serif;letter-spacing:.01em;margin:0;white-space:nowrap}
.lg-slogan{font:400 calc(var(--fs)*.4)/1 'Anton',Impact,'Arial Narrow',sans-serif;letter-spacing:.32em;margin:calc(var(--fs)*.3) 0 0}
.lg-rule{display:block;width:56px;height:4px;background:#1d1f22;margin:26px 0 16px}
.lg-est{margin:0;font-weight:700;font-size:14px;letter-spacing:.18em}
.lg-info{position:relative;z-index:2;margin-top:auto;padding-top:26px;border-top:1.5px solid rgba(29,31,34,.3);width:min(100%,300px);display:grid;gap:22px}
.lg-lbl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-bottom:6px}
.lg-info address,.lg-info p{margin:0;font-size:15px;line-height:1.55;font-weight:500;font-style:normal}
.lg-info a{color:inherit;text-decoration:none}.lg-info a:hover{text-decoration:underline}
.lg-wheel{position:absolute;right:-200px;bottom:-200px;width:460px;height:460px;z-index:1;animation:lgroll 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes lgroll{from{transform:rotate(-200deg) translateX(-80px);opacity:0}to{transform:none;opacity:1}}
@keyframes lgspin{to{transform:rotate(360deg)}}
@keyframes lgrise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.lg-r{display:flex;align-items:center;justify-content:center;padding:40px clamp(18px,4vw,48px)}
.lg-card{width:min(420px,100%);background:var(--surf);border:1px solid var(--line);border-top:6px solid #f2c230;border-radius:12px;padding:clamp(22px,4vw,36px);box-shadow:0 24px 60px -30px #000a;animation:lgrise .55s ease both}
.lg-card h2{font:700 42px/1 var(--fh);margin:0 0 8px;letter-spacing:.3px}
.lg-fld{margin-top:18px}
.lg-in{position:relative}
.lg-in>svg{position:absolute;left:14px;top:16px;width:18px;height:18px;color:var(--mut);pointer-events:none}
.lg-in input{padding-left:44px;min-height:50px;border-radius:12px;font-size:16px}
.lg-eye{position:absolute;right:4px;top:3px;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;color:var(--mut);cursor:pointer;border-radius:10px}
.lg-eye:hover{color:var(--ink)}.lg-eye svg{width:20px;height:20px}
.lg-btn{width:100%;min-height:52px;margin-top:8px;font-size:17px;border-radius:12px;box-shadow:0 10px 24px -12px #f2c230}
.btn.p.lg-btn{background:#f2c230;border-color:#f2c230;color:#1d1f22;font-weight:700}
.btn.p.lg-btn:hover:not(:disabled){background:#e3b422;border-color:#e3b422}
.btn.p.lg-btn:focus-visible{outline:3px solid #1d1f22;outline-offset:2px}
.lg-btn.ld{opacity:.85;cursor:progress}
.lg-btn.ld::after{content:'';display:inline-block;width:16px;height:16px;margin-left:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-3px;animation:lgspin .7s linear infinite}
.lg-err{min-height:22px;margin-top:10px;color:var(--bad);font-size:14px;font-weight:600}
.lg-warn{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:14px}
@media(max-width:1100px){.lg-wheel{display:none}}
@media(max-width:820px){.lg{grid-template-columns:1fr}.lg-l{min-height:0;padding:32px 24px 28px}.lg-brand{--fs:clamp(34px,13vw,72px)}.lg-info{margin-top:30px}.lg-r{align-items:flex-start;padding-top:22px}}
@media(prefers-reduced-motion:reduce){.lg-wheel,.lg-card,.lg-btn.ld::after{animation:none}}
@media print{body>#app,#toast,dialog{display:none!important}#print{display:block!important}html,body{background:#fff}:root{padding:0}}
</style>
</head>
<body>
<div id="app">
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="print"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
const SHOP={name:'Rollin Tyres',tag:'Keep Rollin',addr:'Chettipalayam Pririvu, Marapalam, Madukkarai, Coimbatore - 105',phone:''};
const LOGO=s=>`<svg xmlns="http://www.w3.org/2000/svg" width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true" style="flex:none"><rect width="48" height="48" rx="12" fill="#0e6b66"/><circle cx="26" cy="24" r="12" fill="none" stroke="#fff" stroke-width="5"/><circle cx="26" cy="24" r="3.5" fill="#7fe3da"/><path d="M5 19h7M3 25h8M7 31h7" stroke="#7fe3da" stroke-width="2.5" stroke-linecap="round"/></svg>`;
/* ====== FIREBASE SETUP: paste your project's web config here (Firebase console > Project settings > Your apps) ====== */
const FIREBASE_CONFIG={apiKey:'AIzaSyB1ekpGBdLmAkXHNCWE_cLikezXuOtKgqE',authDomain:'rollin-tyres-9798.firebaseapp.com',projectId:'rollin-tyres-9798',storageBucket:'rollin-tyres-9798.firebasestorage.app',messagingSenderId:'372074086068',appId:'1:372074086068:web:73379c6484eb3d35c2a1e1'};
/* ======================================================================================================================= */
const K='rollin_fb',CFG_OK=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId);
let DB={products:[],invoices:[],log:[],theme:''},fs=null,AUTH='loading',LOADED={},UNSUB=[],pend=0,busy=false;
try{DB.theme=localStorage.getItem(K+'_theme')||''}catch(e){}
const SH={products:{},invoices:{},log:{}};
const KEY={products:x=>x.id,invoices:x=>x.no,log:x=>x.k};
const SORT={products:(a,b)=>a.id.localeCompare(b.id),invoices:(a,b)=>String(b.created).localeCompare(String(a.created)),log:(a,b)=>String(b.t).localeCompare(String(a.t))};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const clean=o=>JSON.parse(JSON.stringify(o));
const INC=n=>firebase.firestore.FieldValue.increment(n);
const COL=c=>fs.collection(c);
const seed=()=>({seq:1,inv:1,theme:'',products:[
['Apollo','90/90-21','Actizip F1',3650,3100,8],['Apollo','100/90-17','Actizip R1',3200,2700,6],['CEAT','120/80-18','Gripp X3',4850,4200,5],['CEAT','100/80-17','Zoom XL',2950,2500,2],['MRF','90/90-18','Zapper Y',2480,2050,10],['MRF','110/90-17','Nylogrip Plus',3150,2650,4],['TVS Eurogrip','2.75-18','Neo Grip',1850,1500,12],['Michelin','110/70-17','Pilot Street',4400,3700,0]
].map((p,i)=>({id:'T'+String(i+1).padStart(3,'0'),brand:p[0],size:p[1],tread:p[2],sell:p[3],cost:p[4],soh:p[5]})),invoices:[],log:[]});
function syncErr(e){console.error(e);toast('Could not save: '+((e&&e.message)||'check your connection'))}
function save(){
 try{localStorage.setItem(K+'_theme',DB.theme||'')}catch(e){}
 if(!fs||AUTH!=='in')return;
 for(const c of ['products','invoices','log']){const cur={};DB[c].forEach(x=>cur[KEY[c](x)]=JSON.stringify(x));
  for(const k in cur)if(SH[c][k]!==cur[k]){SH[c][k]=cur[k];COL(c).doc(k).set(JSON.parse(cur[k])).catch(syncErr)}
  for(const k in SH[c])if(!(k in cur)){delete SH[c][k];COL(c).doc(k).delete().catch(syncErr)}}
}
function listen(c){UNSUB.push(COL(c).onSnapshot(s=>{const arr=[];SH[c]={};s.docs.forEach(d=>{const x=d.data();arr.push({...x});SH[c][d.id]=JSON.stringify(x)});DB[c]=arr.sort(SORT[c]);if(!s.metadata.fromCache||s.size>0)LOADED[c]=1;softRender()},e=>toast('Cannot read data: '+e.message)))}
function softRender(){if(pend)return;const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)&&$('#main').contains(a)){pend=1;return setTimeout(()=>{pend=0;softRender()},1500)}const v={};document.querySelectorAll('#main input[id^=r],#main select[id^=r]').forEach(e=>v[e.id]=e.value);render();for(const k in v){const e=$('#'+k);if(e)e.value=v[k]}}
function initFb(){
 if(!CFG_OK)return render();
 if(typeof firebase==='undefined'){AUTH='out';return render()}
 try{firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
  firebase.auth().onAuthStateChanged(u=>{UNSUB.forEach(f=>f());UNSUB=[];LOADED={};
   if(u){AUTH='in';['products','invoices','log'].forEach(listen)}
   else{AUTH='out';DB.products=[];DB.invoices=[];DB.log=[];for(const c in SH)SH[c]={}}
   render()})}catch(e){console.error(e);AUTH='out';render()}
 render()}
function gateFull(h){$('#nav').style.display='none';$('#main').style.padding='0';$('#main').innerHTML=h}
function gate(h){$('#nav').style.display='none';$('#main').style.padding='';$('#main').innerHTML=`<div style='max-width:540px;margin:5vh auto'>${h}</div>`}
function render(){
 if(!CFG_OK)return gate(setupHtml());
 if(typeof firebase==='undefined')return gate(`<div class='card'><h1>Cannot load Firebase</h1><p>Check your internet connection and reload the page.</p></div>`);
 if(AUTH==='loading')return gate(`<p class='mut' style='text-align:center'>Loading\u2026</p>`);
 if(AUTH==='out')return gateFull(loginHtml());
 $('#nav').style.display='';$('#main').style.padding='';render0()}
function setupHtml(){return `<div class='card'><div style='display:flex;align-items:center;gap:10px'><h1 style='margin:0'>Connect your Firebase</h1></div>
<p>This app keeps its data in your own Firebase project, so it syncs across devices and does not depend on anyone else's service. One-time setup:</p>
<ol style='line-height:1.7;padding-left:20px'><li>Open the Firebase console and create a project.</li><li>Build &gt; <b>Firestore Database</b> &gt; Create database.</li><li>Build &gt; <b>Authentication</b> &gt; Get started &gt; enable <b>Email/Password</b>, then add a user. This is your shop login.</li><li>Project settings &gt; Your apps &gt; add a <b>Web app</b> and copy its config values.</li><li>Paste them into <b>FIREBASE_CONFIG</b> at the top of this file's script.</li><li>Firestore &gt; <b>Rules</b>: paste the rules below and Publish.</li><li>Optional, for phones and other computers: put this file on a web host (Firebase Hosting or Netlify, both free) and open that address on each device.</li></ol>
<pre style='background:var(--bg);padding:12px;border-radius:8px;overflow:auto;font-size:13px'>rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /{document=**} {
      allow read, write: if request.auth != null;
    }
  }
}</pre></div>`}
function loginHtml(){
 const ic=d=>`<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round' aria-hidden='true'>${d}</svg>`;
 const mail=ic(`<rect x='3' y='5' width='18' height='14' rx='2.5'/><path d='m4 7 8 6 8-6'/>`),lock=ic(`<rect x='4.5' y='10.5' width='15' height='10' rx='2.5'/><path d='M8 10.5V8a4 4 0 0 1 8 0v2.5'/>`),eye=ic(`<path d='M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z'/><circle cx='12' cy='12' r='3'/>`);
 return `<div class='lg'>
 <section class='lg-l'>
   <div class='lg-brand'><h1>ROLLIN TYRES</h1><p class='lg-slogan'>KEEP ROLLIN</p><span class='lg-rule'></span><p class='lg-est'>EST. 2027</p></div>
   <div class='lg-info'><div><div class='lg-lbl'><svg viewBox='0 0 24 24' width='16' height='16' aria-hidden='true'><path fill='currentColor' d='M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z'/></svg>Visit us</div><address>${SHOP.addr}</address></div><div><div class='lg-lbl'><svg viewBox='0 0 24 24' width='16' height='16' aria-hidden='true'><path fill='currentColor' d='M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.6 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.6 3.6a1 1 0 0 1-.25 1z'/></svg>Contact</div><p><a href='tel:+919655954749'>+91 96559 54749</a><br><a href='mailto:balajiimaha@gmail.com'>balajiimaha@gmail.com</a></p></div></div>
   <svg class='lg-wheel' viewBox='0 0 400 400' aria-hidden='true'><circle cx='200' cy='200' r='196' fill='#26282b'/><circle cx='200' cy='200' r='178' fill='none' stroke='#3d4046' stroke-width='22' stroke-dasharray='16 9'/><circle cx='200' cy='200' r='140' fill='#1d1f22'/><circle cx='200' cy='200' r='118' fill='#9aa3ab'/><circle cx='200' cy='200' r='104' fill='#26282b'/><g stroke='#9aa3ab' stroke-width='9' stroke-linecap='round'><path d='M200 200V108M200 200L287 172M200 200L253 274M200 200L147 274M200 200L113 172'/></g><circle cx='200' cy='200' r='22' fill='#f2c230'/></svg>
  </section>
  <section class='lg-r'><form class='lg-card' onsubmit='doLogin(event)'>
  <h2>Sign in</h2><p class='mut' style='margin:0'>Sign in to open counter</p>
  <div class='lg-fld'><label for='le'>Email</label><div class='lg-in'>${mail}<input id='le' type='email' autocomplete='username' placeholder='you@example.com' required></div></div>
  <div class='lg-fld'><label for='lp'>Password</label><div class='lg-in'>${lock}<input id='lp' type='password' autocomplete='current-password' placeholder='Your password' required><button type='button' class='lg-eye' onclick='togglePw()' aria-label='Show or hide password'>${eye}</button></div></div>
  <div id='lm' class='lg-err' role='alert'></div>
  <button id='lb' class='btn p lg-btn' type='submit'>Sign in</button>
  <p class='mut' style='text-align:center;font-size:13px;margin:18px 0 0'>For Rollin Tyres staff only.</p>
 </form></section></div>`}
function togglePw(){const i=$('#lp');i.type=i.type==='password'?'text':'password';i.focus()}
async function doLogin(ev){if(ev)ev.preventDefault();const m=$('#lm'),b=$('#lb');m.textContent='';b.disabled=true;b.classList.add('ld');
 try{await firebase.auth().signInWithEmailAndPassword($('#le').value.trim(),$('#lp').value)}
 catch(e){m.textContent=/invalid|wrong|user-not-found|credential/i.test(e.code+e.message)?'Wrong email or password.':/network/i.test(e.code)?'No internet connection.':(e.message||'Could not sign in.');b.disabled=false;b.classList.remove('ld')}}
function doSignOut(){ask('Sign out of Rollin Tyres on this device?','Sign out',()=>firebase.auth().signOut())}
function banner(){if(!(LOADED.products&&LOADED.invoices)||DB.products.length||DB.invoices.length)return '';return `<div class='card'><b>Your database is empty.</b> <span class='mut'>Add tyres in Inventory, or:</span><div class='acts' style='justify-content:flex-start'><button class='btn' onclick='loadSample()'>Load sample tyres</button><button class='btn' onclick='pickBackup()'>Restore from a backup file</button></div></div>`}
async function loadSample(){if(DB.products.length)return;try{const b=fs.batch();seed().products.forEach(p=>b.set(COL('products').doc(p.id),p));await b.commit()}catch(e){syncErr(e)}}
function backupForm(){open_(`<h2>Backup & restore</h2><p class='mut'>Your data is stored only in this browser on this device. Download a backup file regularly. You can restore it here, or on another device, to bring all tyres, bills and logs back.</p><div class='acts' style='justify-content:flex-start'><button class='btn p' onclick='exportBackup()'>Download backup file</button><button class='btn' onclick='pickBackup()'>Restore from a backup file</button></div><div class='acts'><button class='btn' onclick='close_()'>Close</button></div>`)}
function exportBackup(){saveFile('rollin-tyres-backup-'+today()+'.json',JSON.stringify({app:'rollin-tyres',version:1,...DB},null,1))}
function pickBackup(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>restoreBackup(i.files[0]);i.click()}
function restoreBackup(f){if(!f)return;const r=new FileReader();r.onload=()=>{let o;try{o=JSON.parse(r.result);if(!Array.isArray(o.products)||!Array.isArray(o.invoices))throw 0}catch(e){return toast('That file is not a valid backup')}
 close_();ask('Replace everything in this browser with the backup ('+o.products.length+' tyres, '+o.invoices.length+' bills)?','Restore',()=>{DB={products:o.products,invoices:o.invoices,log:(o.log||[]).map(l=>({...l,k:l.k||uid()})),theme:DB.theme};save();render();toast('Backup restored')})};r.readAsText(f)}
const newNo=()=>'RT-'+String(Math.max(0,...DB.invoices.map(i=>{const m=/^RT-(\d+)$/.exec(i.no);return m?+m[1]:0}))+1).padStart(4,'0');
const nextId=()=>'T'+String(Math.max(0,...DB.products.map(p=>parseInt(p.id.slice(1))||0))+1).padStart(3,'0');
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+(+n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString();
const fdt=s=>new Date(s).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'});
const fd=s=>new Date(s+'T00:00').toLocaleDateString('en-IN',{dateStyle:'medium'});
function toast(t){const x=$('#toast');x.textContent=t;x.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>x.style.display='none',2600)}
function log(p,type,delta,after,reason,ref){DB.log.unshift({k:uid(),t:now(),pid:p.id,name:`${p.brand} ${p.size}`,type,delta,after,reason,ref})}
const badge=p=>p.soh<=0?'<span class="badge b-out">Out of stock</span>':p.soh<3?'<span class="badge b-low">Low stock</span>':'<span class="badge b-ok">In stock</span>';
const pname=p=>`${p.brand} ${p.size} ${p.tread}`;

let view='pos',tab='sales',cart=[],cust={name:'',phone:'',veh:'',date:today()},gst=false,rate=18,q='',done=null,iq='';
const NAV=[['pos','Billing (POS)'],['inv','Inventory'],['stock','Stock replenishment'],['hist','Sales history']];
function go(v){view=v;render()}
function render0(){
 if(DB.theme)document.documentElement.dataset.theme=DB.theme;
 $('#nav').innerHTML=`<div class="brand"><div class="bw"><span class="wm">ROLLIN TYRES</span><small class="sl" role="img" aria-label="Keep Rollin"><i>K</i><i>E</i><i>E</i><i>P</i><i class="s"></i><i>R</i><i>O</i><i>L</i><i>L</i><i>I</i><i>N</i></small></div></div>`+NAV.map(n=>`<button class="${view===n[0]?'on':''}" onclick="go('${n[0]}')">${n[1]}</button>`).join('')+`<div class="sp"></div><button onclick="backupForm()">Backup &amp; restore</button><button onclick="doSignOut()">Sign out</button><button onclick="toggleTheme()">Light / dark</button>`;
 $('#main').innerHTML=banner()+({pos:vPos,inv:vInv,stock:vStock,hist:vHist})[view]();
}
function toggleTheme(){const d=document.documentElement.dataset.theme==='dark'||(!DB.theme&&matchMedia('(prefers-color-scheme:dark)').matches);DB.theme=d?'light':'dark';save();render()}

/* ---------- POS ---------- */
const totals=()=>{const sub=cart.reduce((a,c)=>a+c.price*c.qty,0),tax=gst?sub*rate/100:0;return{sub,tax,total:sub+tax}};
function vPos(){
 if(done)return vDone();
 const t=totals(),words=q.toLowerCase().split(/\s+/).filter(Boolean);
 const hits=q?DB.products.filter(p=>words.every(w=>(p.brand+' '+p.size+' '+p.tread+' '+p.id).toLowerCase().includes(w))).slice(0,30):[];
 return `<h1>Billing</h1>
 <div class="card"><div class="row">
  <div><label for="cn">Customer name</label><input id="cn" value="${E(cust.name)}" oninput="cust.name=this.value"></div>
  <div><label for="cp">Phone number</label><input id="cp" type="tel" inputmode="tel" value="${E(cust.phone)}" oninput="cust.phone=this.value"></div>
  <div><label for="cv">Vehicle number</label><input id="cv" value="${E(cust.veh)}" oninput="vehIn(this)" maxlength="13" placeholder="TN 37 AB 1234" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
  <div><label for="cd">Bill date</label><input id="cd" type="date" value="${cust.date}" oninput="cust.date=this.value"></div>
 </div></div>
 <div class="grid2">
  <div class="card"><h2>Find a tyre</h2>
   <input id="sq" placeholder="Search brand, size or pattern, e.g. Apollo 90/90-21" value="${E(q)}" oninput="q=this.value;keep('sq',vPosRes)" aria-label="Search tyres" autocomplete="off">
   <div class="res" id="res">${resHtml(hits)}</div></div>
  <div class="card"><h2>Bill</h2>
   ${cart.length?`<div class="tw"><table><tr><th>Item</th><th class="n">Price</th><th>Qty</th><th class="n">Amount</th><th></th></tr>${cart.map((c,i)=>{const p=DB.products.find(x=>x.id===c.id);return `<tr><td>${E(c.name)}<div class="mut" style="font-size:12px">${p?p.soh:0} in stock</div></td>
   <td class="n"><input type="number" min="0" value="${c.price}" style="width:90px" onchange="cart[${i}].price=Math.max(0,+this.value||0);render()" aria-label="Unit price"></td>
   <td><span class="q"><button class="btn s" onclick="qty(${i},-1)" aria-label="Decrease">−</button><input type="number" min="1" value="${c.qty}" onchange="setQty(${i},this.value)" aria-label="Quantity"><button class="btn s" onclick="qty(${i},1)" aria-label="Increase">+</button></span></td>
   <td class="n">${inr(c.price*c.qty)}</td><td><button class="btn s d" onclick="cart.splice(${i},1);render()" aria-label="Remove">✕</button></td></tr>`}).join('')}</table></div>`:'<p class="mut">No items yet. Search and tap a tyre to add it.</p>'}
   <div class="row" style="margin:12px 0"><label style="display:flex;gap:8px;align-items:center;margin:0;flex:0 0 auto"><input type="checkbox" style="width:22px;min-height:22px" ${gst?'checked':''} onchange="gst=this.checked;render()"> Add GST</label>

 L.forEach(i=>i.items.forEach(c=>{const a=c.price*c.qty,g=a*(i.rate||0)/100;rows.push([i.no,i.date,i.name,i.phone,i.veh,c.name,c.qty,c.price,a.toFixed(2),i.rate||0,g.toFixed(2),(a+g).toFixed(2),(+i.total).toFixed(2)].map(q).join(','))}));
 saveFile(`rollin-sales_${rf}_to_${rt}.csv`,String.fromCharCode(0xFEFF)+rows.join(String.fromCharCode(13,10)))}
function dlSummaryPdf(){const J=PDF();if(!J)return;const L=srt(rng());if(!L.length)return toast('No bills in this date range');
 const d=new J({unit:'mm',format:'a4'}),s=sumR(L);let y=12;d.setFont('helvetica','bold');d.setFontSize(26);d.text('ROLLIN TYRES',15,y+8,{charSpace:.5});y+=12;d.setFont('helvetica','normal');d.setFontSize(9);d.text(SHOP.tag.toUpperCase(),15,y+1,{charSpace:2});y+=10;d.setFont('helvetica','bold');d.setFontSize(16);d.text('Sales report',15,y);y+=6;d.setFont('helvetica','normal');d.setFontSize(10);d.text(fd(rf)+' to '+fd(rt),15,y);y+=5;d.text(SHOP.addr,15,y);y+=8;
 [['Bills',L.length],['Tyres sold',s.units],['Tyre cost',rs(s.cost)],['Sales before GST',rs(s.sub)],['GST collected',rs(s.tax)],['Total billed',rs(s.total)],['Gross profit (before GST)',rs(s.profit)]].forEach(r=>{d.text(r[0],15,y);d.text(String(r[1]),95,y,{align:'right'});y+=5.5});y+=4;
 const head=c=>{d.setFont('helvetica','bold');d.setFontSize(9);c.forEach(x=>d.text(x[0],x[1],y,{align:x[2]||'left'}));y+=2;d.line(15,y,195,y);y+=5;d.setFont('helvetica','normal')};
 const C1=[['Bill #',15],['Date',46],['Customer',72],['Subtotal',140,'right'],['GST',166,'right'],['Total',195,'right']];head(C1);
 L.forEach(i=>{if(y>275){d.addPage();y=18;head(C1)}d.text(i.no,15,y);d.text(fd(i.date),46,y);d.text(String(i.name).slice(0,28),72,y);d.text((+i.sub).toFixed(2),140,y,{align:'right'});d.text((+i.tax).toFixed(2),166,y,{align:'right'});d.text((+i.total).toFixed(2),195,y,{align:'right'});y+=5.5});
 const m={};L.forEach(i=>i.items.forEach(c=>{const o=m[c.name]||(m[c.name]={q:0,a:0});o.q+=c.qty;o.a+=c.price*c.qty}));
 y+=8;if(y>250){d.addPage();y=18}d.setFont('helvetica','bold');d.setFontSize(12);d.text('Tyres sold',15,y);y+=6;const C2=[['Item',15],['Qty',150,'right'],['Amount (before GST)',195,'right']];head(C2);
 Object.entries(m).sort((a,b)=>b[1].q-a[1].q).forEach(e=>{if(y>275){d.addPage();y=18;head(C2)}d.text(e[0],15,y);d.text(String(e[1].q),150,y,{align:'right'});d.text(e[1].a.toFixed(2),195,y,{align:'right'});y+=5.5});
 saveFile(`rollin-sales-report_${rf}_to_${rt}.pdf`,d.output('blob'))}

function doDel(L,r){L.forEach(i=>i.items.forEach(c=>{const p=DB.products.find(x=>x.id===c.id);if(!p)return;if(r){p.soh+=c.qty;log(p,'Sale cancelled',c.qty,p.soh,'Bill '+i.no+' deleted, stock returned',i.no)}else log(p,'Bill deleted',0,p.soh,'Bill '+i.no+' deleted, stock unchanged',i.no)}));const ns=new Set(L.map(i=>i.no));DB.invoices=DB.invoices.filter(i=>!ns.has(i.no));save()}
function delInvForm(no){const i=getInv(no);if(!i)return;open_(`<h2>Delete bill ${i.no}?</h2><p>${E(i.name)} · ${inr(i.total)}<br><span class='mut'>It will be removed from sales history and reports. This cannot be undone.</span></p><label style='display:flex;gap:8px;align-items:center'><input type='checkbox' id='dr' checked style='width:22px;min-height:22px'> Return the tyres to stock</label><div class='acts'><button class='btn' onclick='close_()'>Cancel</button><button class='btn' style='background:var(--bad);border-color:var(--bad);color:#fff' onclick="delInv('${i.no}')">Delete bill</button></div>`)}
function delInv(no){const r=$('#dr').checked;doDel([getInv(no)],r);close_();render();toast('Bill deleted')}
function delRangeForm(){const L=rng();if(!L.length)return toast('No bills in this date range');open_(`<h2>Delete ${L.length} bill${L.length>1?'s':''}?</h2><p>Every bill from ${fd(rf)} to ${fd(rt)} will be removed from sales history and reports. This cannot be undone. Download the CSV first if you want a copy.</p><label style='display:flex;gap:8px;align-items:center'><input type='checkbox' id='dr' style='width:22px;min-height:22px'> Return the tyres to stock</label><div style='margin-top:10px'><label for='dc'>Type DELETE to confirm</label><input id='dc' autocomplete='off'></div><div class='acts'><button class='btn' onclick='close_()'>Cancel</button><button class='btn' style='background:var(--bad);border-color:var(--bad);color:#fff' onclick='delRange()'>Delete all</button></div>`)}
function delRange(){if($('#dc').value.trim()!=='DELETE')return toast('Type DELETE to confirm');const L=rng(),r=$('#dr').checked;doDel(L,r);close_();render();toast(L.length+' bills deleted')}

/* ---------- Mobile-safe WhatsApp & confirmations ---------- */
let ASK=null;
function ask(m,l,fn){ASK=fn;open_(`<h2>Please confirm</h2><p>${E(m)}</p><div class='acts'><button class='btn' onclick='close_()'>Cancel</button><button class='btn p' onclick='close_();ASK&&ASK()'>${E(l)}</button></div>`)}
function delProd(id){const p=DB.products.find(x=>x.id===id);if(!p)return;ask('Delete '+pname(p)+'? Past bills and logs are kept.','Delete tyre',()=>{DB.products=DB.products.filter(x=>x.id!==id);log(p,'Deleted',0,0,'Product removed');save();render();toast('Tyre deleted')})}
function waMsg(i){return `*${SHOP.name}* - Bill ${i.no}\nDate: ${fd(i.date)}\nCustomer: ${i.name}${i.veh?'\nVehicle: '+i.veh:''}\n\n`+i.items.map(c=>`- ${c.name} x ${c.qty} = ${inr(c.price*c.qty)}`).join('\n')+`\n\nSubtotal: ${inr(i.sub)}${i.gst?`\nGST (${i.rate}%): ${inr(i.tax)}`:''}\n*Total: ${inr(i.total)}*\n\nThank you for your purchase!\n${SHOP.tag}\n${SHOP.addr}`}
function waUrl(i){let p=(i.phone||'').replace(/\D/g,'');if(p.length===11&&p[0]==='0')p=p.slice(1);if(p.length===10)p='91'+p;return 'https://wa.me/'+p+'?text='+encodeURIComponent(waMsg(i))}
function waUp(no){const i=getInv(no);i.phone=$('#wp').value.trim();$('#wl').href=waUrl(i)}
function waCopy(no){const m=waMsg(getInv(no));(navigator.clipboard?navigator.clipboard.writeText(m):Promise.reject()).then(()=>toast('Message copied. Paste it in WhatsApp.'),()=>{const t=$('#wm');const r=document.createRange();r.selectNodeContents(t);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Message selected. Press and hold to copy.')})}
function waShare(no){const i=getInv(no);navigator.share({title:'Bill '+i.no,text:waMsg(i)}).catch(()=>{})}
function wa(no){const i=getInv(no);if(!i)return;
 open_(`<h2>Send bill ${i.no} on WhatsApp</h2><p class='mut' style='font-size:14px;margin:0 0 12px'>"Share PDF" sends the bill as a PDF file through your phone's share menu: choose WhatsApp, then the customer. WhatsApp links alone can only carry text.</p><div class='row'><div><label for='wp'>Customer phone (10 digits)</label><input id='wp' type='tel' inputmode='tel' value='${E(i.phone)}' oninput="waUp('${no}')" onchange='save()'></div></div>
 <pre id='wm' style='white-space:pre-wrap;font:inherit;background:var(--bg);padding:10px;border-radius:8px;max-height:30vh;overflow:auto;margin:12px 0 0'>${E(waMsg(i))}</pre>
 <div class='acts'><button class='btn' onclick='close_()'>Close</button><button class='btn' onclick="waCopy('${no}')">Copy message</button>${navigator.share?`<button class='btn' onclick="waShare('${no}')">Share…</button>`:''}${navigator.canShare?`<button class='btn p' onclick="waPdf('${no}')">Share PDF</button>`:`<button class='btn p' onclick="dlInvoice('${no}','a4')">Download PDF</button>`}<a id='wl' class='btn' href='${waUrl(i)}' target='_blank' rel='noopener' style='display:inline-flex;align-items:center;text-decoration:none'>Send text only</a></div>`)}

async function waPdf(no){const i=getInv(no);if(!i)return;const d=await buildPdf(i,'a4');if(!d)return;const file=new File([d.output('blob')],i.no+'.pdf',{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Bill '+i.no,text:SHOP.name+' - Bill '+i.no+' - '+inr(i.total)});return}catch(e){if(e&&e.name==='AbortError')return}}
 toast('This phone or view cannot share files directly. Downloading the PDF instead.');dlInvoice(no,'a4')}

/* ---------- Delete stock-in & audit log records ---------- */
function delLogForm(k,stk){const l=DB.log.find(x=>x.k===k);if(!l)return;const rev=stk&&l.type==='Stock-in'&&l.delta>0;
 open_(`<h2>Delete this ${stk?'stock-in':'audit log'} record?</h2><p>${E(l.name)} · ${l.delta>0?'+':''}${l.delta} · ${fdt(l.t)}<br><span class='mut'>${E(l.reason)}</span></p>${rev?`<label style='display:flex;gap:8px;align-items:center'><input type='checkbox' id='dr' checked style='width:22px;min-height:22px'> Also take these ${l.delta} units off stock</label>`:`<p class='mut'>Only the record is removed. Stock counts do not change.</p>`}<div class='acts'><button class='btn' onclick='close_()'>Cancel</button><button class='btn' style='background:var(--bad);border-color:var(--bad);color:#fff' onclick="delLog('${k}',${rev})">Delete record</button></div>`)}
function delLog(k,rev){const l=DB.log.find(x=>x.k===k);if(!l)return;if(rev&&$('#dr')&&$('#dr').checked){const p=DB.products.find(x=>x.id===l.pid);if(p){const n=Math.max(0,p.soh-l.delta),d=n-p.soh;p.soh=n;log(p,'Manual override',d,n,'Stock-in record deleted ('+l.reason+')')}}DB.log=DB.log.filter(x=>x.k!==k);save();close_();render();toast('Record deleted')}
function delAllLogForm(kind){const L=kind==='stock'?DB.log.filter(l=>l.type==='Stock-in'):DB.log;if(!L.length)return toast('Nothing to delete');
 open_(`<h2>Delete ${L.length} ${kind==='stock'?'stock-in':'audit log'} record${L.length>1?'s':''}?</h2><p>Only the records are removed. Stock counts do not change. This cannot be undone.</p><div><label for='dc'>Type DELETE to confirm</label><input id='dc' autocomplete='off'></div><div class='acts'><button class='btn' onclick='close_()'>Cancel</button><button class='btn' style='background:var(--bad);border-color:var(--bad);color:#fff' onclick="delAllLog('${kind}')">Delete all</button></div>`)}
function delAllLog(kind){if($('#dc').value.trim()!=='DELETE')return toast('Type DELETE to confirm');DB.log=kind==='stock'?DB.log.filter(l=>l.type!=='Stock-in'):[];save();close_();render();toast('Records deleted')}

/* ---------- Vehicle number auto-format ---------- */
function fmtVeh(v){const c=String(v).toUpperCase().replace(/[^A-Z0-9]/g,'');let m=/^(\d{2})(BH)(\d{0,4})([A-Z]{0,2})/.exec(c);if(m)return [m[1],m[2],m[3],m[4]].filter(Boolean).join(' ');m=/^([A-Z]{0,2})(\d{0,2})([A-Z]{0,3})(\d{0,4})/.exec(c);return [m[1],m[2],m[3],m[4]].filter(Boolean).join(' ')}
const VEH=/^([A-Z]{2} \d{2} [A-Z]{1,3} \d{4}|\d{2} BH \d{4} [A-Z]{1,2})$/;
function vehHint(v){return !v?'':VEH.test(v)?'<span style="color:var(--ok)">\u2713 Valid format</span>':'<span class="mut">Format: TN 37 AB 1234</span>'}
function vehIn(el){const f=fmtVeh(el.value);el.value=f;cust.veh=f}

/* ---------- Atomic Firebase operations: safe when several devices bill at once ---------- */
const mkLog=(p,type,delta,after,reason,ref)=>clean({k:uid(),t:now(),pid:p.id,name:`${p.brand} ${p.size}`,type,delta,after,reason,ref:ref||null});
async function nextBillNo(){const ref=fs.doc('meta/counters'),local=Math.max(0,...DB.invoices.map(i=>{const m=/^RT-(\d+)$/.exec(i.no);return m?+m[1]:0}));
 const n=await fs.runTransaction(async t=>{const d=await t.get(ref);const cur=Math.max(d.exists?(d.data().bill||0):0,local)+1;t.set(ref,{bill:cur},{merge:true});return cur});
 return 'RT-'+String(n).padStart(4,'0')}
async function commitOps(ops){for(let i=0;i<ops.length;i+=400){const b=fs.batch();ops.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
async function complete(){
 if(!cart.length||busy)return;
 for(const c of cart){const p=DB.products.find(x=>x.id===c.id);if(!p||p.soh<c.qty)return toast('Not enough stock: '+c.name)}
 busy=true;
 try{const t=totals(),no=await nextBillNo();
  const inv=clean({no,date:cust.date||today(),created:now(),name:cust.name||'Walk-in customer',phone:cust.phone||'',veh:cust.veh||'',items:cart.map(c=>({...c})),gst,rate:gst?rate:0,sub:t.sub,tax:t.tax,total:t.total});
  const ops=[b=>b.set(COL('invoices').doc(no),inv)];
  cart.forEach(c=>{const p=DB.products.find(x=>x.id===c.id),lg=mkLog(p,'Sale',-c.qty,p.soh-c.qty,'Bill '+no,no);ops.push(b=>b.update(COL('products').doc(c.id),{soh:INC(-c.qty)}),b=>b.set(COL('log').doc(lg.k),lg))});
  await commitOps(ops);done=inv;cart=[];cust={name:'',phone:'',veh:'',date:today()};gst=false;q='';render()
 }catch(e){syncErr(e)}finally{busy=false}}
async function stockIn(){const p=DB.products.find(x=>x.id===$('#r1').value),n=Math.floor(+$('#r2').value),s=$('#r3').value.trim(),b=$('#r4').value.trim();
 if(!p||!(n>0))return toast('Enter a quantity of 1 or more');if(!s||!b)return toast('Supplier and bill number are required');
 const lg=mkLog(p,'Stock-in',n,p.soh+n,`${s} / Bill ${b}`);
 try{await commitOps([x=>x.update(COL('products').doc(p.id),{soh:INC(n)}),x=>x.set(COL('log').doc(lg.k),lg)]);render();toast(`Added ${n} to ${p.brand} ${p.size}`)}catch(e){syncErr(e)}}
async function doDel(L,r){const ops=[],run={};
 L.forEach(i=>{i.items.forEach(c=>{const p=DB.products.find(x=>x.id===c.id);if(!p)return;const cur=run[p.id]??p.soh;
  if(r){run[p.id]=cur+c.qty;const lg=mkLog(p,'Sale cancelled',c.qty,cur+c.qty,'Bill '+i.no+' deleted, stock returned',i.no);ops.push(b=>b.update(COL('products').doc(p.id),{soh:INC(c.qty)}),b=>b.set(COL('log').doc(lg.k),lg))}
  else{const lg=mkLog(p,'Bill deleted',0,cur,'Bill '+i.no+' deleted, stock unchanged',i.no);ops.push(b=>b.set(COL('log').doc(lg.k),lg))}});
  ops.push(b=>b.delete(COL('invoices').doc(i.no)))});
 try{await commitOps(ops)}catch(e){syncErr(e)}}

/* ---------- History ---------- */
function vHist(){
 const t=`<div class="tabs"><button class="btn ${tab==='sales'?'on':''}" onclick="tab='sales';render()">Sales log</button><button class="btn ${tab==='audit'?'on':''}" onclick="tab='audit';render()">Stock audit log</button></div>`;
 if(tab==='audit')return `<h1>Sales history</h1>${t}<div class="card"><button class="btn d" onclick="delAllLogForm('all')">Delete entire audit log</button></div><div class="card tw"><table><tr><th>When</th><th>Product</th><th>Type</th><th class="n">SOH before</th><th class="n">Change</th><th class="n">SOH after</th><th>Reason / reference</th><th></th></tr>
 ${DB.log.map(l=>`<tr><td>${fdt(l.t)}</td><td>${E(l.name)}</td><td>${l.type}</td><td class="n">${l.type==='Deleted'?'–':l.after-l.delta}</td><td class="n" style="color:var(${l.delta<0?'--bad':'--ok'})">${l.delta>0?'+':''}${l.delta||'–'}</td><td class="n">${l.after}</td><td>${E(l.reason)}</td><td><button class="btn s d" onclick="delLogForm('${l.k}',false)">Delete</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">Nothing logged yet.</td></tr>'}</table></div>`;
 return `<h1>Sales history</h1>${t}${rptBar()}<div class="card tw"><table><tr><th>Bill #</th><th>Date</th><th>Customer</th><th>Vehicle</th><th class="n">Total</th><th>Actions</th></tr>
 ${rng().map(i=>`<tr><td><b>${i.no}</b></td><td>${fd(i.date)}</td><td>${E(i.name)}<div class="mut" style="font-size:13px">${E(i.phone)}</div></td><td>${E(i.veh)}</td><td class="n">${inr(i.total)}</td>
 <td style="white-space:nowrap"><button class="btn s" onclick="viewInv('${i.no}')">View</button> <button class="btn s" onclick="dlInvoice('${i.no}','a4')">A4 PDF</button> <button class="btn s" onclick="dlInvoice('${i.no}','th')">Receipt PDF</button> <button class="btn s w" onclick="wa('${i.no}')">WhatsApp</button> <button class="btn s d" onclick="delInvForm('${i.no}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6" class="mut">No bills yet. Complete a sale in Billing.</td></tr>'}</table></div>`}
function viewInv(no){const i=getInv(no);open_(`<div style="background:#fff;padding:14px;border-radius:8px;overflow:auto">${invHtml(i,'a4')}</div>
 <div class="row" style="margin-top:10px"><div><label>Customer phone (for WhatsApp)</label><input id="vp" type="tel" value="${E(i.phone)}" onchange="getInv('${no}').phone=this.value.trim();save()"></div></div>
 <div class="acts"><button class="btn" onclick="close_()">Close</button><button class="btn" onclick="dlInvoice('${no}','a4')">A4 PDF</button><button class="btn" onclick="dlInvoice('${no}','th')">Receipt PDF</button><button class="btn" onclick="printInv('${no}','a4')">Print A4</button><button class="btn" onclick="printInv('${no}','th')">Print receipt</button><button class="btn w" onclick="wa('${no}')">WhatsApp</button></div>`)}

initFb();
</script>
